# ==============================================================================
# Render Blueprint Specification for SmartBiz Backend + PostgreSQL Database
# (For deployments where root directory is set to SmartBiz/backend)
# ==============================================================================

services:
  - type: web
    name: smartbiz-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartbiz-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-biz-frontend-iota.vercel.app,http://localhost:3000
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

databases:
  - name: smartbiz-postgres
    databaseName: smartbiz
    user: smartbiz_user
    plan: free
    region: oregon

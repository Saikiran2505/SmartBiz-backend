# ===================================================================
# SmartBiz Backend Configuration - MySQL & Spring Data JPA
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=smartbiz

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/smartbiz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

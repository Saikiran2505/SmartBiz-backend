# ===================================================================
# SmartBiz Backend Configuration - Cloud (Render/PostgreSQL) & Local (MySQL)
# ===================================================================

# Server Port (Render injects PORT dynamically, fallback to 8080 locally)
server.port=${PORT:8080}

# Application Name
spring.application.name=smartbiz

# Database Configuration (supports Render PostgreSQL or local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/smartbiz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# Allowed CORS Origins (Frontend on Vercel and local development)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://smart-biz-frontend-iota.vercel.app,http://localhost:3000,http://localhost:5173}

